project:
  type: website
  output-dir: docs
  resources:
    - swirl-demo.mp4
    - swirl-demo.jpg
    # PDFs da versão de 2025: nenhuma página aponta para eles, mas são
    # publicados para não quebrar links antigos.
    - "slides/*.pdf"
  render:
    - "*.qmd"
    - "aula-*/index.qmd"
    - "slides/*.qmd"
    - "!README.md"

website:
  title: "Bioestatística"
  description: "Disciplina obrigatória — Ciências Biológicas, UFMS"
  site-url: "https://provetelab.org/bioestatistica/"
  favicon: favicon.png
  open-graph: true

  repo-url: "https://github.com/diogoprov/bioestatistica"

  navbar:
    background: light
    pinned: true
    collapse-below: lg
    title: "Bioestatística"
    left:
      - href: index.qmd
        text: Início
      - href: comece-aqui.qmd
        text: Comece aqui
      - href: programa.qmd
        text: Programa
      - text: Estudar
        menu:
          - href: exercicios-swirl.qmd
            text: Exercícios no R
          - href: revisao.qmd
            text: Revisão e Kahoots
          - href: glossario.qmd
            text: Glossário
    right:
      - icon: github
        href: "https://github.com/diogoprov/bioestatistica"
        aria-label: GitHub
      - icon: house-door
        href: "https://provetelab.org/"
        aria-label: Biodiversity Synthesis Lab

  page-footer:
    background: light
    left: |
      © Diogo B. Provete · Biodiversity Synthesis Lab · Instituto de Biociências, UFMS
    center: |
      Conteúdo sob [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.pt-br), exceto onde indicado
    right: |
      Built with [Quarto](https://quarto.org).

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: right
    toc-depth: 3
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true

knitr:
  opts_chunk:
    dev.args:
      bg: "#faf7f0"

# Os slides têm chunks de R que geram as figuras. Com freeze, o resultado
# fica em _freeze/ (versionado) e o CI renderiza só com o Quarto, sem R.
# Depois de mudar um .qmd com código, rode `quarto render` localmente e
# commite _freeze/ junto.
lang: pt
execute:
  freeze: auto
  warning: false
  message: false

editor: source
