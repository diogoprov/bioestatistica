project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "aula-*/index.qmd"
    - "slides/*.qmd"
    - "!README.md"

website:
  title: "Bioestatística"
  description: "Disciplina obrigatória — Ciências Biológicas, UFMS"
  site-url: "https://provetelab.org/bioestatistica/"
  favicon: favicon.png
  open-graph: true

  navbar:
    background: light
    pinned: true
    left:
      - href: index.qmd
        text: Início
    right:
      - text: "Biodiversity Synthesis Lab"
        href: "https://provetelab.org/"
      - icon: github
        href: "https://github.com/diogoprov/bioestatistica"
        aria-label: GitHub

  page-footer:
    background: light
    left: |
      Diogo B. Provete · Instituto de Biociências, UFMS
    right: |
      Voltar ao [site do laboratório](https://provetelab.org/).

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: right
    toc-depth: 3
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      - text: |
          <link rel="stylesheet"
                href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

knitr:
  opts_chunk:
    dev.args:
      bg: "#faf7f0"

# Os slides têm chunks de R que geram as figuras. Com freeze, o resultado
# fica em _freeze/ (versionado) e o CI renderiza só com o Quarto, sem R.
# Depois de mudar um .qmd com código, rode `quarto render` localmente e
# commite _freeze/ junto.
lang: pt
execute:
  freeze: auto
  warning: false
  message: false

editor: source
